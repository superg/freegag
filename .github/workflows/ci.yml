name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  metadata:
    name: Build metadata
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      package-name: ${{ steps.metadata.outputs.package-name }}
      release: ${{ steps.metadata.outputs.release }}
    steps:
      - name: Resolve version
        id: metadata
        shell: bash
        run: |
          version="0.8.1"
          revision="${GITHUB_SHA::7}"
          release="false"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                  echo "Release tags must use the form vMAJOR.MINOR.PATCH." >&2
                  exit 1
              fi

              version="${GITHUB_REF_NAME#v}"
              revision=""
              release="true"
          fi

          package_name="freegag-${version}"
          if [[ -n "${revision}" ]]; then
              package_name="${package_name}-${revision}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "package-name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "release=${release}" >> "${GITHUB_OUTPUT}"

  windows:
    name: Windows ${{ matrix.name }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            runner: windows-2025
            cmake-architecture: x64
            package-architecture: x64
            pe-machine: "8664"
          - name: x86
            runner: windows-2025
            cmake-architecture: Win32
            package-architecture: x86
            pe-machine: "014c"
          - name: ARM64
            runner: windows-11-vs2026-arm
            cmake-architecture: ARM64
            package-architecture: arm64
            pe-machine: "aa64"
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build
          -G "Visual Studio 18 2026"
          -A ${{ matrix.cmake-architecture }}
          -DCMAKE_BUILD_TYPE=Release
          "-DFREEGAG_VERSION=${{ needs.metadata.outputs.version }}"
          "-DCPACK_PACKAGE_FILE_NAME=${{ needs.metadata.outputs.package-name }}-windows-${{ matrix.package-architecture }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify architecture
        shell: pwsh
        run: |
          $expected = [Convert]::ToUInt16("${{ matrix.pe-machine }}", 16)
          $executables = @(
              "build/src/Release/freegag.exe",
              "build/tools/xtet_resource_extractor/Release/xtet_resource_extractor.exe"
          )

          foreach ($executable in $executables) {
              $reader = [IO.BinaryReader]::new([IO.File]::OpenRead($executable))
              try {
                  $reader.BaseStream.Seek(0x3c, [IO.SeekOrigin]::Begin) | Out-Null
                  $peOffset = $reader.ReadInt32()
                  $reader.BaseStream.Seek($peOffset + 4, [IO.SeekOrigin]::Begin) | Out-Null
                  $machine = $reader.ReadUInt16()
              }
              finally {
                  $reader.Dispose()
              }

              if ($machine -ne $expected) {
                  throw "$executable has PE machine 0x$($machine.ToString('x4')); expected 0x$($expected.ToString('x4'))."
              }
          }

      - name: Package
        working-directory: build
        run: cpack --config CPackConfig.cmake -C Release -G ZIP

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: freegag-windows-${{ matrix.package-architecture }}
          path: build/${{ needs.metadata.outputs.package-name }}-windows-${{ matrix.package-architecture }}.zip
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux ${{ matrix.name }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            runner: ubuntu-26.04
            package-architecture: x64
            elf-machine: Advanced Micro Devices X86-64
          - name: x86
            runner: ubuntu-26.04
            package-architecture: x86
            elf-machine: Intel 80386
          - name: ARM64
            runner: ubuntu-26.04-arm
            package-architecture: arm64
            elf-machine: AArch64
    env:
      CC: /usr/bin/clang-22
      CXX: /usr/bin/clang++-22
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install native build dependencies
        if: matrix.package-architecture != 'x86'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            git \
            make \
            pkg-config \
            cmake \
            ninja-build \
            gnome-desktop-testing \
            libasound2-dev \
            libpulse-dev \
            libaudio-dev \
            libfribidi-dev \
            libjack-dev \
            libsndio-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libthai-dev \
            libusb-1.0-0-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libdecor-0-dev

      - name: Install 32-bit build dependencies
        if: matrix.package-architecture == 'x86'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            gcc-15-multilib \
            g++-15-multilib \
            git \
            make \
            pkg-config \
            cmake \
            ninja-build \
            gnome-desktop-testing \
            libasound2-dev:i386 \
            libpulse-dev:i386 \
            libaudio-dev:i386 \
            libfribidi-dev:i386 \
            libjack-dev:i386 \
            libsndio-dev:i386 \
            libx11-dev:i386 \
            libxext-dev:i386 \
            libxrandr-dev:i386 \
            libxcursor-dev:i386 \
            libxfixes-dev:i386 \
            libxi-dev:i386 \
            libxss-dev:i386 \
            libxtst-dev:i386 \
            libxkbcommon-dev:i386 \
            libdrm-dev:i386 \
            libgbm-dev:i386 \
            libgl1-mesa-dev:i386 \
            libgles2-mesa-dev:i386 \
            libegl1-mesa-dev:i386 \
            libdbus-1-dev:i386 \
            libibus-1.0-dev:i386 \
            libudev-dev:i386 \
            libthai-dev:i386 \
            libusb-1.0-0-dev:i386 \
            libpipewire-0.3-dev:i386 \
            libwayland-dev:i386 \
            libdecor-0-dev:i386
          echo "PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "${GITHUB_ENV}"
          echo "CFLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/15 -m32" >> "${GITHUB_ENV}"
          echo "CXXFLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/15 -m32" >> "${GITHUB_ENV}"
          echo "LDFLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/15 -m32" >> "${GITHUB_ENV}"

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCLANG_FORMAT=/usr/bin/clang-format-22
          "-DFREEGAG_VERSION=${{ needs.metadata.outputs.version }}"
          "-DCPACK_PACKAGE_FILE_NAME=${{ needs.metadata.outputs.package-name }}-linux-${{ matrix.package-architecture }}"

      - name: Build
        run: cmake --build build --parallel

      - name: Check formatting
        if: matrix.package-architecture == 'x64'
        run: cmake --build build --target check-format

      - name: Verify architecture
        shell: bash
        run: |
          readelf --file-header build/src/freegag | grep --fixed-strings "Machine:                           ${{ matrix.elf-machine }}"
          readelf --file-header build/tools/xtet_resource_extractor/xtet_resource_extractor | grep --fixed-strings "Machine:                           ${{ matrix.elf-machine }}"

      - name: Package
        working-directory: build
        run: cpack --config CPackConfig.cmake -C Release -G ZIP

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: freegag-linux-${{ matrix.package-architecture }}
          path: build/${{ needs.metadata.outputs.package-name }}-linux-${{ matrix.package-architecture }}.zip
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS Universal
    needs: metadata
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Report Apple toolchain
        run: |
          xcodebuild -version
          clang++ --version

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          "-DFREEGAG_VERSION=${{ needs.metadata.outputs.version }}"
          "-DCPACK_PACKAGE_FILE_NAME=${{ needs.metadata.outputs.package-name }}-macos-universal"

      - name: Build
        run: cmake --build build --parallel

      - name: Verify architectures and deployment target
        shell: bash
        run: |
          executables=(
              build/src/freegag
              build/tools/xtet_resource_extractor/xtet_resource_extractor
          )

          for executable in "${executables[@]}"; do
              lipo "${executable}" -verify_arch x86_64 arm64

              for architecture in x86_64 arm64; do
                  minimum_version="$(otool -l -arch "${architecture}" "${executable}" | awk '$1 == "minos" { print $2 }')"
                  if [[ "${minimum_version}" != "11.0" ]]; then
                      echo "${executable} (${architecture}) targets macOS ${minimum_version}; expected 11.0." >&2
                      exit 1
                  fi
              done
          done

      - name: Package
        working-directory: build
        run: cpack --config CPackConfig.cmake -C Release -G ZIP

      - name: Verify package contents
        shell: bash
        run: |
          archive="build/${{ needs.metadata.outputs.package-name }}-macos-universal.zip"
          package_root="${{ needs.metadata.outputs.package-name }}-macos-universal"
          actual_files="$(unzip -Z1 "${archive}" | sed '/\/$/d' | sort)"
          expected_files="$(printf '%s\n' "${package_root}/freegag" "${package_root}/xtet_resource_extractor" | sort)"

          if [[ "${actual_files}" != "${expected_files}" ]]; then
              echo "Unexpected macOS package contents:" >&2
              printf '%s\n' "${actual_files}" >&2
              exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: freegag-macos-universal
          path: build/${{ needs.metadata.outputs.package-name }}-macos-universal.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    if: needs.metadata.outputs.release == 'true'
    needs:
      - metadata
      - windows
      - linux
      - macos
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: freegag-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -name 'freegag-*.zip' -print | sort)
          if [[ "${#assets[@]}" -ne 7 ]]; then
              echo "Expected exactly seven release archives, found ${#assets[@]}." >&2
              exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
              gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes
          fi
